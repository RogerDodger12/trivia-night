<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Trivia Night test page</title>
<style>
  body { font-family: sans-serif; max-width: 900px; margin: 20px auto; padding: 0 10px; }
  input, select, button { padding: 6px; margin: 3px; }
  pre { background: #111; color: #0f0; padding: 10px; height: 200px; overflow: auto; }
  .box { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
  .banner { background: #fff3b0; border: 1px solid #c9a800; padding: 8px; margin: 6px 0; }
  .card { border: 1px solid #888; border-radius: 6px; padding: 8px; margin: 6px 0; background: #f7f7f7; }
  .opt { display: block; width: 100%; text-align: left; margin: 2px 0; }
  .sel { background: #9cf; font-weight: bold; }
</style>
</head>
<body>
<h2>Trivia Night test page</h2>

<div class="box">
  Server: <input id="server" size="40" value="http://127.0.0.1:8787"><br>
  Mode:
  <select id="mode"><option value="solo">solo</option><option value="teams">teams</option></select>
  <button onclick="createRoom()">Create room and connect as host</button>
  <div>Room code: <b id="code">-</b></div>
</div>

<div class="box">
  Player or team name: <input id="pname">
  <button onclick="addPlayer()">Add player</button>
  <button onclick="addDisplay()">Open display</button>
</div>

<div class="box"><b>Host view</b><div id="host">(not connected)</div></div>
<div class="box"><b>Simulated phones</b><div id="players">(none)</div></div>
<pre id="log"></pre>

<script>
var code = "", hostWs = null, hostState = null, hostOffset = 0, players = [];

function base() { return document.getElementById("server").value.replace(/\/$/, ""); }
function wsUrl() { return base().replace(/^http/, "ws") + "/api/rooms/" + code + "/ws"; }

function log(label, text) {
  var el = document.getElementById("log");
  el.textContent += label + ": " + text + "\n";
  el.scrollTop = el.scrollHeight;
}

function mk(tag, text, parent) {
  var e = document.createElement(tag);
  if (text !== null && text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}

function btn(label, fn, parent, disabled) {
  var b = mk("button", label, parent);
  b.onclick = fn;
  if (disabled) b.disabled = true;
  return b;
}

function connect(label, joinMsg, onMsg) {
  var ws = new WebSocket(wsUrl());
  ws.onopen = function () { ws.send(JSON.stringify(joinMsg)); };
  ws.onmessage = function (e) { log(label, e.data); if (onMsg) onMsg(JSON.parse(e.data)); };
  ws.onclose = function () { log(label, "closed"); };
  return ws;
}

function hostSend(type, extra) {
  if (!hostWs) return;
  hostWs.send(JSON.stringify(Object.assign({ type: type }, extra || {})));
}

async function createRoom() {
  var mode = document.getElementById("mode").value;
  var r = await fetch(base() + "/api/rooms", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mode: mode })
  });
  var data = await r.json();
  if (!r.ok) { log("create", JSON.stringify(data)); return; }
  code = data.code;
  players = [];
  hostState = null;
  renderPlayers();
  renderHost();
  document.getElementById("code").textContent = code + " (" + data.mode + ")";
  log("create", "room " + code + " created");
  hostWs = connect("host", { type: "join", role: "host", hostKey: data.hostKey }, function (m) {
    if (m.type === "state") { hostState = m; hostOffset = m.now - Date.now(); renderHost(); }
  });
}

function addPlayer() {
  if (!code) { log("error", "Create a room first"); return; }
  var name = document.getElementById("pname").value;
  var p = { name: name, playerId: null, ws: null, state: null, pick: null, pickQ: 0, offset: 0 };
  players.push(p);
  openPlayer(p, { type: "join", role: "player", name: name });
}

function openPlayer(p, joinMsg) {
  p.ws = connect("player(" + p.name + ")", joinMsg, function (m) {
    if (m.type === "joined") { p.playerId = m.playerId; p.name = m.name; }
    if (m.type === "state") {
      p.state = m;
      p.offset = m.now - Date.now();
      if (m.questionNumber !== p.pickQ) { p.pick = null; p.pickQ = m.questionNumber; }
    }
    if (m.type === "error" && !p.playerId) {
      players = players.filter(function (x) { return x !== p; });
    }
    renderPlayers();
  });
  p.ws.addEventListener("close", renderPlayers);
}

function addDisplay() {
  if (!code) { log("error", "Create a room first"); return; }
  connect("display", { type: "join", role: "display" }, null);
}

function letter(i) { return String.fromCharCode(65 + i); }

function renderHost() {
  var el = document.getElementById("host");
  el.innerHTML = "";
  var s = hostState;
  if (!s) { el.textContent = "(not connected)"; return; }

  var head = mk("div", null, el);
  mk("b", "Phase: " + s.phase, head);
  if (s.questionNumber > 0) mk("span", "    Question " + s.questionNumber + " of " + s.questionTotal, head);
  if (s.phase === "question") {
    var t = mk("span", "", head);
    t.className = "timer";
    t.dataset.deadline = s.deadline;
    t.dataset.offset = hostOffset;
  }

  if (s.question) {
    mk("div", s.question.text, el).style.fontWeight = "bold";
    s.question.options.forEach(function (o, i) {
      mk("div", letter(i) + ") " + o + (i === s.hostCorrect ? "   (correct)" : ""), el);
    });
  }

  if (s.progress && (s.phase === "question" || s.phase === "locked")) {
    var pr = s.progress;
    mk("div", "Answered: " + pr.answered + " of " + pr.total +
      (pr.disconnected ? " (" + pr.disconnected + " disconnected)" : ""), el);
    if (s.phase === "question" && pr.allAnswered) {
      var b = mk("div", null, el);
      b.className = "banner";
      mk("b", "Everyone has answered. Ready to lock and reveal?  ", b);
      btn("Lock & Reveal", function () { hostSend("host:reveal"); }, b);
    }
  }

  if (s.reveal) {
    mk("div", "Answer counts: " + s.reveal.counts.map(function (n, i) {
      return letter(i) + "=" + n;
    }).join("  "), el);
  }

  if (s.leaderboard) {
    mk("div", "Leaderboard:", el).style.fontWeight = "bold";
    s.leaderboard.forEach(function (p) {
      mk("div", p.rank + ". " + p.name + " - " + p.score, el);
    });
  }

  var c = mk("div", null, el);
  btn("Start game", function () { hostSend("host:start"); }, c, s.phase !== "lobby");
  btn("Lock", function () { hostSend("host:lock"); }, c, s.phase !== "question");
  btn("Reveal", function () { hostSend("host:reveal"); }, c, s.phase !== "question" && s.phase !== "locked");
  btn("Leaderboard", function () { hostSend("host:leaderboard"); }, c, s.phase !== "reveal");
  btn("Next question", function () { hostSend("host:next"); }, c, s.phase !== "reveal" && s.phase !== "leaderboard");
  var lab = mk("label", null, c);
  var cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = !!s.autoLock;
  cb.onchange = function () { hostSend("host:autoLock", { on: cb.checked }); };
  lab.appendChild(cb);
  lab.appendChild(document.createTextNode(" auto-lock when all answered"));

  mk("div", "Roster:", el).style.fontWeight = "bold";
  s.roster.forEach(function (p) {
    var d = mk("div", p.name + (p.online ? " (online) " : " (offline) "), el);
    btn("Kick", function () { hostSend("host:kick", { playerId: p.id }); }, d);
  });
}

function renderPlayers() {
  var el = document.getElementById("players");
  el.innerHTML = "";
  if (!players.length) { el.textContent = "(none)"; return; }
  players.forEach(function (p) {
    var card = mk("div", null, el);
    card.className = "card";
    var open = p.ws && p.ws.readyState === 1;
    var s = p.state;
    mk("b", p.name + (open ? " (connected) " : " (disconnected) ") +
      (s && s.me ? " score " + s.me.score : ""), card);
    if (open) {
      btn("Disconnect", function () { p.ws.close(); }, card);
    } else {
      btn("Reconnect", function () {
        openPlayer(p, { type: "join", role: "player", playerId: p.playerId });
      }, card);
    }
    if (!s) return;
    mk("div", "Phase: " + s.phase, card);

    if (s.question && (s.phase === "question" || s.phase === "locked")) {
      if (s.phase === "question") {
        var t = mk("div", "", card);
        t.className = "timer";
        t.dataset.deadline = s.deadline;
        t.dataset.offset = p.offset;
      }
      mk("div", s.question.text, card).style.fontWeight = "bold";
      var frozen = s.me.submitted || s.phase !== "question" || !s.me.eligible;
      var shown = s.me.submitted ? s.me.choice : p.pick;
      s.question.options.forEach(function (o, i) {
        var b = btn(letter(i) + ") " + o, function () { p.pick = i; renderPlayers(); }, card, frozen);
        b.className = "opt" + (shown === i ? " sel" : "");
      });
      btn("Submit", function () {
        if (p.pick === null) return;
        p.ws.send(JSON.stringify({ type: "submit", choice: p.pick }));
      }, card, frozen || p.pick === null);
      if (s.me.submitted) mk("div", "Locked in, waiting for others.", card);
      else if (!s.me.eligible) mk("div", "You joined mid-question. You are in for the next one.", card);
      else if (s.phase === "locked") mk("div", "Time is up. No answer recorded.", card);
    }

    if (s.reveal && s.me) {
      mk("div", "Correct answer: " + letter(s.reveal.correct) + ") " + s.question.options[s.reveal.correct], card);
      var res = s.me.result;
      var txt = res.correct ? "You got it! +" + res.gained
        : (s.me.submitted ? "Wrong, +0" : "No answer, +0");
      mk("b", txt, card);
    }

    if (s.leaderboard) {
      mk("div", "Leaderboard:", card).style.fontWeight = "bold";
      s.leaderboard.forEach(function (x) {
        mk("div", x.rank + ". " + x.name + " - " + x.score, card);
      });
    }
  });
}

setInterval(function () {
  document.querySelectorAll(".timer").forEach(function (t) {
    var left = Math.max(0, Math.ceil(
      (Number(t.dataset.deadline) - (Date.now() + Number(t.dataset.offset))) / 1000));
    t.textContent = "Time left: " + left + "s";
  });
}, 250);
</script>
</body>
</html>
